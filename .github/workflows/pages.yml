# Deploys www/fuocucina.com as the GitHub Pages site root on every push to main.
name: deploy fuocucina.com
on:
  push:
    branches: [main]
    paths: ['fuocucina.com/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fuocucina.com
      - id: deployment
        uses: actions/deploy-pages@v4
